# Continuous delivery for version tags.
#
# Cut a release:
#   1. Set `version:` in pubspec.yaml (e.g. 1.0.0+1).
#   2. git tag version-1.0.0+1
#   3. git push origin version-1.0.0+1
#
# The tag must contain "version" and equal version-<pubspec version>.
# That publishes a GitHub Release with a release APK.
#
# The Android build still uses the debug keystore (see android/app/build.gradle)
# until a real signing config is added.
name: CD

on:
  push:
    tags:
      - '*version*'
  pull_request:
    paths:
      - '.github/workflows/cd.yml'
      - 'tool/check_release_tag.sh'
      - 'pubspec.yaml'
      - 'android/**'
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  check-tag:
    name: check-tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Self-test tag rules
        run: bash tool/check_release_tag.sh --self-test

      - name: Read pubspec version
        id: meta
        run: |
          version="$(bash tool/check_release_tag.sh --print-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pubspec version is $version"

      - name: Require tag to match pubspec
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: bash tool/check_release_tag.sh "${{ github.ref_name }}"

  release:
    name: release
    needs: check-tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VERSION: ${{ needs.check-tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: flutter analyze

      - name: Run tests
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: flutter test --concurrency=1 --reporter expanded

      - name: Build release APK
        run: flutter build apk --release

      - name: Name the APK with the pubspec version
        run: |
          mkdir -p dist
          src="build/app/outputs/flutter-apk/app-release.apk"
          dest="dist/gym_app-${APP_VERSION}.apk"
          cp "$src" "$dest"
          ls -lh "$dest"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym_app-${{ needs.check-tag.outputs.version }}
          path: dist/gym_app-${{ needs.check-tag.outputs.version }}.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="$(cat <<EOF
          Version \`${APP_VERSION}\` from tag \`${{ github.ref_name }}\`.

          Android APK is signed with the debug keystore until a release signing config is added.
          EOF
          )"
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "$notes" \
            "dist/gym_app-${APP_VERSION}.apk"
